# 本仓库实际在用的构建：镜像名按分支动态生成（github.repository_owner 转小写），
# 非 main/dev 分支统一推到 <owner>/moontvplus-dev2。手动触发专用。
name: 【本仓库】Docker 镜像构建 → moontvplus-dev2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定 Docker 标签'
        required: false
        # 手动触发时，默认 tag 为 dev
        default: 'dev'
        type: string
  # 已移除 push 到 dev 分支时的自动构建，仅保留手动触发
  # push:
  #   branches: [ dev ]
  # pull_request:
  #   branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 出于安全考虑，大部分步骤只需要 read 权限
  packages: write
  # 不再需要 actions: write —— 删除运行记录的 cleanup-refresh job 已移除

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}
    steps:
      - name: Prepare platform name
        run: |
          echo "PLATFORM_NAME=${{ matrix.platform }}" | sed 's|/|-|g' >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=v$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      # 新增步骤：根据分支动态设置镜像名称
      - name: Set image name based on branch
        id: set_image_name
        run: |
          # owner 必须转小写：GHCR 仓库名不允许大写，否则 merge job 里手写的
          # printf "$IMAGE_NAME@sha256:..." 会被 imagetools 拒绝
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "IMAGE_NAME=ghcr.io/$OWNER/moontvplus" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "IMAGE_NAME=ghcr.io/$OWNER/moontvplus-dev2" >> $GITHUB_ENV
          else
            # 为其他分支或手动触发设置一个默认值
            echo "IMAGE_NAME=ghcr.io/$OWNER/moontvplus-dev2" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # 这个步骤不再需要，因为我们直接用 github.repository_owner
      # - name: Set lowercase repository owner ...
      
      # 更改：使用动态镜像名和更强大的标签逻辑
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 1. 版本号标签，始终打上（来自 VERSION.txt）
            type=raw,value=${{ steps.version.outputs.version }}
            # 2. 只有在手动触发时，才使用输入的 tag
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # 3. 推送到分支时，使用分支名作为 tag (e.g., 'dev', 'main')
            type=ref,event=branch
            # 4. 只有当是默认分支(通常是main)时，才打 'latest' 标签
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # 更改：使用 meta 步骤生成的标签和 labels
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 更改：使用动态镜像名
          outputs: type=image,name=${{ env.IMAGE_NAME }},name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=v$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # 新增步骤：在 merge 任务中也需要设置同样的镜像名称
      - name: Set image name based on branch
        id: set_image_name
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "IMAGE_NAME=ghcr.io/$OWNER/moontvplus" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "IMAGE_NAME=ghcr.io/$OWNER/moontvplus-dev2" >> $GITHUB_ENV
          else
            echo "IMAGE_NAME=ghcr.io/$OWNER/moontvplus-dev2" >> $GITHUB_ENV
          fi

      # 新增步骤：在 merge 任务中也需要生成同样的标签列表
      - name: Extract metadata for manifest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # metadata-action 的 tags 输出是换行分隔的，用官方 JSON 输出转成 -t 参数
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

  cleanup-untagged:
    runs-on: ubuntu-latest
    needs:
      - merge
    steps:
      - name: Set package name based on branch
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "PACKAGE_NAME=moontvplus" >> $GITHUB_ENV
          else
            echo "PACKAGE_NAME=moontvplus-dev2" >> $GITHUB_ENV
          fi

      - name: Delete untagged image versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ env.PACKAGE_NAME }}
          delete-untagged: true
          validate: true

  # 已移除上游的 cleanup-refresh job（Mattraks/delete-workflow-runs，retain_days: 0）：
  # 它的删除范围是整个仓库（repository: ${{ github.repository }}），不限本工作流，
  # 且带 if: always()，会把本仓库正常构建的运行记录一并删掉。
